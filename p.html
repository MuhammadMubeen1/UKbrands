<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIEW DEMO WEBSITE</title>
  <meta property="og:title" content="VIEW DEMO WEBSITE">
  <meta property="og:description" content="A designed website demo for your Google listing.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=1200&q=80">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Manrope, system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #16332e 0%, #07110f 45%, #05080a 100%);
      color: #e8fff6;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .card {
      width: min(560px, 100%);
      background: linear-gradient(180deg, #0e4038 0%, #0a2c28 100%);
      border: 1px solid rgba(37, 211, 102, 0.35);
      border-radius: 28px;
      padding: 28px 24px 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
    }
    .msg { font-size: 1.02rem; line-height: 1.65; color: #d9fff0; }
    .msg strong { color: #fff; }
    .msg a { color: #7dffb3; word-break: break-all; }
  </style>
</head>
<body>
  <article class="card">
    <div class="msg" id="msg">Loading…</div>
  </article>
  <script>
    const LIVE = "https://muhammadmubeen1.github.io/UKbrands/";
    const q = new URLSearchParams(location.search);
    const id = String(q.get("id") || "").replace(/^l(?=lon-)/, "");
    const name = q.get("n") || "there";
    const demo = LIVE + "w.html?id=" + encodeURIComponent(id);
    function escapeHtml(v) {
      return String(v || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function render(n) {
      document.getElementById("msg").innerHTML =
        "Hi <strong>" + escapeHtml(n) + "</strong> team 👋<br><br>" +
        "I found your Google listing and noticed you don’t have a website, so I designed a quick demo for you:<br><br>" +
        "🌐 <a href=\"" + demo + "\">" + demo + "</a><br><br>" +
        "If you’re interested, I can create a <strong>fully customized website + mobile booking app</strong> where customers can easily book appointments online 📱, along with <strong>Local SEO</strong> to help you rank higher than competitors and get more customers.<br><br>" +
        "Interested? I’d be happy to discuss it.<br><br>" +
        "Best regards,<br><strong>M. Mubeen</strong> | Digital Growth Specialist<br>" +
        "🌐 <a href=\"https://mubecodes.com\" target=\"_blank\" rel=\"noopener\">https://mubecodes.com</a>";
    }
    render(name);
    const s = document.createElement("script");
    s.src = LIVE + "data/pakistan_no_website_bundle.js";
    s.onload = function () {
      const all = Object.values(window.PAKISTAN_NO_WEBSITE_LEADS || {}).flat();
      const lead = all.find(function (l) { return l.id === id; });
      if (lead) render(lead.name);
    };
    document.head.appendChild(s);
  </script>
</body>
</html>
